services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - client

  client:
    image: ${CLIENT_IMAGE:?Set CLIENT_IMAGE}
    restart: unless-stopped
    environment:
      BACKEND_HOST: server:3001
    depends_on:
      server:
        condition: service_healthy

  server:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://promanage:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/promanage
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: production
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api', r => process.exit(r.statusCode === 404 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: promanage
      POSTGRES_USER: promanage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promanage -d promanage"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  db-data:
    name: promanage_ec2_db_data
  uploads:
    name: promanage_ec2_uploads
  caddy-data:
    name: promanage_ec2_caddy_data
  caddy-config:
    name: promanage_ec2_caddy_config
