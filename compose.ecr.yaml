services:
  client:
    image: ${CLIENT_IMAGE:?Set CLIENT_IMAGE to the client image URI and tag}
    ports:
      - "127.0.0.1:8080:80"
    environment:
      BACKEND_HOST: server:3001
    depends_on:
      - server
  server:
    image: ${SERVER_IMAGE:?Set SERVER_IMAGE to the server image URI and tag}
    environment:
      DATABASE_URL: postgresql://promanage:promanage@db:5432/promanage
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET to a secret of at least 24 characters}
      HOST: 0.0.0.0
      PORT: 3001
      NODE_ENV: development
    volumes:
      - ecr-uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: promanage
      POSTGRES_USER: promanage
      POSTGRES_PASSWORD: promanage
    volumes:
      - ecr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promanage -d promanage"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  ecr-db-data:
  ecr-uploads:
